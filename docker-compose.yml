version: "3"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__UserDbContext: "server=db;Port=5433;Database=MyOwnUMS;Username=postgres;Password="
      ConnectionStrings__RedisCache: "redis:6379,defaultDatabase=0"
    ports:
      - "5036:80"
    restart: unless-stopped
    depends_on:
      - db
      - redis
        
  db:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 
      POSTGRES_DB: MyOwnUMS
    ports:
      - "5433:5432"
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
    
  redis:
    image: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data
  
volumes:
    db-data:
    redis-data:
